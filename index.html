<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMeet AI v2 — Multi-Agent Execution Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --color-warm-parchment: #faf9f6;
      --color-paper-white: #ffffff;
      --color-soft-linen: #e4e2d9;
      --color-ink-black: #171717;
      --color-stone: #555555;
      --color-ash: #777777;
      --font-inter: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-inter); }
    body { background-color: var(--color-warm-parchment); color: var(--color-ink-black); min-height: 100vh; padding-bottom: 48px; overflow-x: hidden; font-size: 16px; }
    
    .floating-nav {
      background: var(--color-paper-white);
      border-radius: 100px;
      box-shadow: rgba(17, 17, 17, 0.08) 0px 4px 20px -2px, rgba(17, 17, 17, 0.05) 0px 0px 0px 1px;
      border: 1px solid var(--color-soft-linen);
      padding: 10px 28px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; margin: 14px auto 28px auto;
      position: sticky; top: 14px; z-index: 1000;
    }
    .paper-card {
      background: var(--color-paper-white);
      border: 1px solid var(--color-soft-linen);
      border-radius: 16px;
      box-shadow: rgba(17, 17, 17, 0.05) 0px 0px 0px 1px, rgba(17, 17, 17, 0.08) 0px 3px 14px 0px;
      padding: 36px 48px; width: 100%; margin: 0 auto;
    }
    .btn-dark {
      background: var(--color-ink-black); color: #ffffff;
      padding: 12px 28px; border-radius: 8px; font-weight: 600; font-size: 16px;
      border: none; cursor: pointer; transition: all 0.15s ease;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .btn-dark:hover { background: #212121; }
    .btn-outline {
      background: #ffffff; border: 1px solid var(--color-soft-linen);
      color: var(--color-ink-black); padding: 7px 16px; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    }
    .badge-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
      border-radius: 100px; font-size: 14px; font-weight: 600;
      border: 1px solid var(--color-soft-linen); background: #ffffff; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('capture');
      const [mode, setMode] = useState('mic');
      const [title, setTitle] = useState('Sprint Release Sync & Action Plan');
      const [transcript, setTranscript] = useState(
        'Rahul: Can you finish the Login UI prototype by Friday?\n' +
        'Priya: Sure, I will prepare the test plan by next Wednesday.\n' +
        'Alex: Great! We also decided to postpone the production deployment until security audit completes.'
      );
      const [loading, setLoading] = useState(false);
      const [pendingTasks, setPendingTasks] = useState([]);
      const [committedTasks, setCommittedTasks] = useState([
        { id: 't-101', task: 'Develop Authentication & JWT Module', owner: 'Rahul', deadline: '2026-07-25', priority: 'High', status: 'Completed', cross_meeting_note: 'Completed during previous sprint.' },
        { id: 't-102', task: 'Design Initial PostgreSQL Database Schema', owner: 'Priya', deadline: '2026-07-24', priority: 'High', status: 'Completed', cross_meeting_note: 'Completed and committed to repo.' },
        { id: 't-103', task: 'Draft OpenAPI Swagger Specification', owner: 'Alex', deadline: '2026-07-28', priority: 'Medium', status: 'Pending', cross_meeting_note: 'Carried over to current meeting.' },
        { id: 't-104', task: 'Configure Redis Celery Worker Pipeline', owner: 'Alex', deadline: '2026-07-26', priority: 'High', status: 'Blocked', cross_meeting_note: 'Blocked waiting for infrastructure setup.' }
      ]);

      const handleRunPipeline = async () => {
        setLoading(true);
        try {
          const res = await fetch('http://127.0.0.1:8000/api/orchestrate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, transcript, mode })
          });
          const data = await res.json();
          setPendingTasks(data.pipeline_result.tasks);
          setActiveTab('approval');
        } catch (e) {
          // Offline fallback
          setPendingTasks([
            { id: 't-1', task: 'Finish Login UI Prototype & Component Specs', owner: 'Rahul', deadline: '2026-07-29', priority: 'High', confidence: 0.95, status: 'Pending Approval', cross_meeting_note: 'New action item from meeting.' },
            { id: 't-2', task: 'Prepare QA Automation & Integration Test Plan', owner: 'Priya', deadline: '2026-08-04', priority: 'Medium', confidence: 0.92, status: 'Pending Approval', cross_meeting_note: 'New action item from meeting.' }
          ]);
          setActiveTab('approval');
        } finally {
          setLoading(false);
        }
      };

      const handleApproveAll = () => {
        setCommittedTasks(prev => [...prev, ...pendingTasks.map(t => ({ ...t, status: 'Pending' }))]);
        setPendingTasks([]);
        setActiveTab('board');
      };

      return (
        <div>
          {/* Floating Navigation Pill */}
          <nav className="floating-nav">
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', minWidth: '180px' }} onClick={() => setActiveTab('capture')}>
              <span style={{ fontSize: '18px', fontWeight: 700, color: '#171717', letterSpacing: '-0.5px' }}>SmartMeet AI</span>
              <span style={{ fontSize: '11px', background: '#171717', color: '#fff', padding: '3px 8px', borderRadius: '100px', fontWeight: 600 }}>v2.0</span>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              {[
                { id: 'capture', label: 'Ingest & Capture' },
                { id: 'approval', label: `Human Approval (${pendingTasks.length})` },
                { id: 'board', label: 'Execution Board' },
                { id: 'intelligence', label: 'Cross-Meeting Memory' },
                { id: 'analytics', label: 'Analytics & Reminders' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    padding: '8px 18px', borderRadius: '100px', fontSize: '15px', fontWeight: activeTab === tab.id ? 600 : 500,
                    background: activeTab === tab.id ? '#171717' : 'transparent',
                    color: activeTab === tab.id ? '#ffffff' : '#171717', border: 'none', cursor: 'pointer', whiteSpace: 'nowrap'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', minWidth: '200px', justifyContent: 'flex-end' }}>
              <div style={{ fontSize: '13px', fontWeight: 600, color: '#555555', background: '#faf9f6', padding: '6px 14px', borderRadius: '100px', border: '1px solid #e4e2d9', whiteSpace: 'nowrap' }}>
                Backend: 127.0.0.1:8000
              </div>
            </div>
          </nav>

          <main style={{ width: '100%', padding: '0 32px' }}>
            {activeTab === 'capture' && (
              <div>
                <div style={{ textAlign: 'center', width: '100%', margin: '0 auto 28px auto' }}>
                  <div style={{ display: 'inline-flex', alignItems: 'center', gap: '8px', background: '#171717', color: '#fff', padding: '6px 16px', borderRadius: '100px', fontSize: '14px', fontWeight: 600, marginBottom: '12px' }}>
                    <span style={{ background: 'rgba(255,255,255,0.22)', padding: '2px 8px', borderRadius: '100px', fontSize: '11px' }}>NEW v2</span> Multi-Agent Platform
                  </div>
                  <h1 style={{ fontSize: '56px', fontWeight: 700, letterSpacing: '-2.5px', lineHeight: 1.12, marginBottom: '12px' }}>
                    Turn meeting speech into verified, trackable action plans.
                  </h1>
                  <p style={{ fontSize: '19px', color: '#555555', maxWidth: '820px', margin: '0 auto 24px auto', lineHeight: 1.55 }}>
                    Capture authorized meetings via Chrome extension tab audio or microphone stream. Specialized AI agents transcribe speech, extract commitments, assign owners, predict deadlines, and follow up until completion.
                  </p>

                  <div style={{ display: 'flex', justifyContent: 'center', gap: '16px', alignItems: 'center' }}>
                    <button onClick={() => setMode('mic')} className="btn-dark">
                      🎤 Capture Live Voice Meeting
                    </button>
                    <button onClick={() => setMode('demo')} style={{ background: 'transparent', color: '#171717', fontSize: '16px', fontWeight: 600, border: 'none', cursor: 'pointer', textDecoration: 'underline', textUnderlineOffset: '5px' }}>
                      ⚡ Try 1-Click Demo Preset →
                    </button>
                  </div>
                </div>

                <div className="paper-card">
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px', borderBottom: '1px solid #e4e2d9', paddingBottom: '16px' }}>
                    <div>
                      <h2 style={{ fontSize: '26px', fontWeight: 700 }}>Meeting Ingestion & Live Stream Studio</h2>
                      <p style={{ fontSize: '15px', color: '#555555', marginTop: '3px' }}>Select meeting input mode to initiate multi-agent pipeline processing.</p>
                    </div>
                    <span className="badge-pill">4 Specialized Worker Agents Ready</span>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '16px', marginBottom: '24px' }}>
                    {[
                      { id: 'mic', title: '🎤 Live Voice Mic', desc: 'Speak into microphone live' },
                      { id: 'demo', title: '⚡ 1-Click Preset', desc: 'Pre-loaded demo transcript' },
                      { id: 'upload', title: '📁 File Upload', desc: 'Upload audio or paste text' },
                      { id: 'extension', title: '🧩 Extension Tab', desc: 'Google Meet / Zoom capture' },
                    ].map(item => (
                      <div
                        key={item.id}
                        onClick={() => setMode(item.id)}
                        style={{
                          padding: '16px 20px', borderRadius: '10px',
                          border: mode === item.id ? '2px solid #171717' : '1px solid #e4e2d9',
                          background: mode === item.id ? '#faf9f6' : '#ffffff', cursor: 'pointer'
                        }}
                      >
                        <div style={{ fontSize: '16px', fontWeight: 700 }}>{item.title}</div>
                        <div style={{ fontSize: '13px', color: '#555555', marginTop: '4px' }}>{item.desc}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ marginBottom: '20px' }}>
                    <label style={{ display: 'block', fontSize: '15px', fontWeight: 600, marginBottom: '8px' }}>Meeting Title</label>
                    <input type="text" value={title} onChange={e => setTitle(e.target.value)} style={{ width: '100%', padding: '12px 16px', borderRadius: '8px', border: '1px solid #e4e2d9', background: '#faf9f6', fontSize: '15px' }} />
                  </div>
                  <div style={{ marginBottom: '24px' }}>
                    <label style={{ display: 'block', fontSize: '15px', fontWeight: 600, marginBottom: '8px' }}>Transcript Utterances</label>
                    <textarea rows="4" value={transcript} onChange={e => setTranscript(e.target.value)} style={{ width: '100%', padding: '12px 16px', borderRadius: '8px', border: '1px solid #e4e2d9', background: '#faf9f6', fontFamily: 'monospace', fontSize: '14px' }}></textarea>
                  </div>
                  <button onClick={handleRunPipeline} className="btn-dark" style={{ width: '100%', justifyContent: 'center', padding: '14px 28px', fontSize: '16px' }}>
                    {loading ? '⚡ Running Multi-Agent Pipeline...' : '⚡ Process Meeting via Multi-Agent Pipeline'}
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'approval' && (
              <div className="paper-card">
                <h2 style={{ fontSize: '26px', fontWeight: 700, marginBottom: '8px' }}>✨ Human-in-the-Loop Approval Portal</h2>
                <p style={{ fontSize: '15px', color: '#555555', marginBottom: '24px' }}>Review AI-extracted commitments before database commit.</p>
                {pendingTasks.map((t, idx) => (
                  <div key={idx} style={{ padding: '20px', border: '1px solid #e4e2d9', borderRadius: '12px', marginBottom: '16px', background: '#ffffff' }}>
                    <div style={{ fontWeight: 700, fontSize: '17px', marginBottom: '10px' }}>{t.task}</div>
                    <div style={{ display: 'flex', gap: '20px', fontSize: '14px', color: '#555555' }}>
                      <span>👤 Owner: <strong>{t.owner}</strong></span>
                      <span>📅 Target: <strong>{t.deadline}</strong></span>
                      <span>🔥 Urgency: <strong>{t.priority}</strong></span>
                      <span>🎯 Confidence: <strong>{Math.round((t.confidence || 0.95) * 100)}%</strong></span>
                    </div>
                  </div>
                ))}
                <button onClick={handleApproveAll} className="btn-dark" style={{ marginTop: '20px', padding: '14px 28px', fontSize: '16px' }}>
                  ✓ Verify & Commit {pendingTasks.length} Tasks to Database
                </button>
              </div>
            )}

            {activeTab === 'board' && (
              <div className="paper-card">
                <h2 style={{ fontSize: '26px', fontWeight: 700, marginBottom: '24px' }}>📋 Real-Time Execution Task Board</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '20px' }}>
                  {['Pending', 'In Progress', 'Blocked', 'Completed'].map(status => (
                    <div key={status} style={{ background: '#faf9f6', padding: '18px', borderRadius: '12px', border: '1px solid #e4e2d9' }}>
                      <div style={{ fontSize: '15px', fontWeight: 700, marginBottom: '14px' }}>{status}</div>
                      {committedTasks.filter(t => t.status === status).map(t => (
                        <div key={t.id} style={{ background: '#ffffff', padding: '16px', borderRadius: '10px', border: '1px solid #e4e2d9', marginBottom: '10px', fontSize: '14px' }}>
                          <div style={{ fontWeight: 700, fontSize: '15px' }}>{t.task}</div>
                          <div style={{ color: '#555555', fontSize: '13px', marginTop: '6px', fontWeight: 500 }}>👤 {t.owner} • 📅 {t.deadline}</div>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'intelligence' && (
              <div className="paper-card">
                <h2 style={{ fontSize: '26px', fontWeight: 700, marginBottom: '16px' }}>🧠 Cross-Meeting Intelligence Hub</h2>
                <div style={{ background: '#faf9f6', padding: '24px', borderRadius: '12px', border: '1px solid #e4e2d9', marginBottom: '28px', fontSize: '16px' }}>
                  <strong>Automated Status Recap:</strong> Previous Meetings Memory: 5 total tasks tracked across meetings. 3 Completed, 1 Pending, 1 Blocked.
                </div>
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="paper-card">
                <h2 style={{ fontSize: '26px', fontWeight: 700, marginBottom: '24px' }}>📊 Analytics & Reminders</h2>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '24px', textAlign: 'center' }}>
                  <div style={{ background: '#faf9f6', padding: '24px', borderRadius: '12px', border: '1px solid #e4e2d9' }}>
                    <div style={{ fontSize: '36px', fontWeight: 700 }}>96.5%</div>
                    <div style={{ fontSize: '14px', color: '#555555', marginTop: '4px', fontWeight: 500 }}>Accuracy</div>
                  </div>
                  <div style={{ background: '#faf9f6', padding: '24px', borderRadius: '12px', border: '1px solid #e4e2d9' }}>
                    <div style={{ fontSize: '36px', fontWeight: 700 }}>100%</div>
                    <div style={{ fontSize: '14px', color: '#555555', marginTop: '4px', fontWeight: 500 }}>Reminder Success</div>
                  </div>
                  <div style={{ background: '#faf9f6', padding: '24px', borderRadius: '12px', border: '1px solid #e4e2d9' }}>
                    <div style={{ fontSize: '36px', fontWeight: 700 }}>4.5 hrs</div>
                    <div style={{ fontSize: '13px', color: '#555555', marginTop: '4px', fontWeight: 500 }}>Time Saved / Lead</div>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
